<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'unsafe-inline' https://unpkg.com; connect-src https://api.openweathermap.org https://*.tile.openstreetmap.org https://tile.openweathermap.org; img-src * data: blob:;">
    <title>SkyCheck - App Meteo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #333;
            --text-secondary: #666;
            --card-gradient-start: #667eea;
            --card-gradient-end: #764ba2;
            --input-border: #ddd;
            --input-focus: #667eea;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient-start: #1a1a2e;
                --bg-gradient-end: #16213e;
                --container-bg: rgba(30, 30, 46, 0.95);
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --card-gradient-start: #2d3561;
                --card-gradient-end: #1f2937;
                --input-border: #444;
                --input-focus: #667eea;
                --shadow-color: rgba(0, 0, 0, 0.6);
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px var(--shadow-color);
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
            background: var(--container-bg);
            color: var(--text-primary);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--input-focus);
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-search {
            background: #667eea;
            color: white;
        }

        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-location {
            background: #48bb78;
            color: white;
            width: 100%;
        }

        .btn-location:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .weather-info {
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .city-name {
            text-align: center;
            font-size: 2em;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        /* Allerte meteo */
        .weather-alerts {
            background: #fed7d7;
            border: 2px solid #fc8181;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .weather-alerts.active {
            display: block;
        }

        .weather-alerts h3 {
            color: #c53030;
            margin-bottom: 10px;
        }

        .alert-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .alert-item:last-child {
            margin-bottom: 0;
        }

        .alert-title {
            font-weight: bold;
            color: #c53030;
            margin-bottom: 5px;
        }

        .alert-description {
            color: #666;
            font-size: 0.9em;
        }

        /* Mappa */
        .map-container {
            background: var(--container-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--input-border);
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .map-header h3 {
            color: var(--text-primary);
            font-size: 1.2em;
        }

        .map-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .map-toggle {
            padding: 5px 10px;
            font-size: 0.8em;
            border-radius: 5px;
            background: var(--input-border);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .map-toggle.active {
            background: #667eea;
            color: white;
        }

        #map {
            height: 400px;
            border-radius: 10px;
            z-index: 1;
        }

        .weather-card {
            background: linear-gradient(135deg, var(--card-gradient-start) 0%, var(--card-gradient-end) 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            margin-bottom: 20px;
        }

        .weather-icon-main {
            text-align: center;
            font-size: 5em;
            margin-bottom: 10px;
        }

        .temp-main {
            font-size: 4em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .weather-description {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .sun-times {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .sun-time-item {
            text-align: center;
        }

        .sun-time-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .sun-time-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .sun-time-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Previsioni 7 giorni */
        .forecast-section {
            background: var(--container-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid var(--input-border);
        }

        .forecast-section h3 {
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .forecast-day {
            background: linear-gradient(135deg, var(--card-gradient-start) 0%, var(--card-gradient-end) 100%);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            color: white;
        }

        .forecast-date {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .forecast-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .forecast-temp {
            font-size: 1.2em;
            font-weight: bold;
        }

        .forecast-temp-range {
            font-size: 0.8em;
            opacity: 0.8;
            margin-top: 5px;
        }

        .forecast-desc {
            font-size: 0.8em;
            margin-top: 5px;
            text-transform: capitalize;
        }

        .air-quality {
            background: var(--container-bg);
            border-radius: 15px;
            padding: 20px;
            color: var(--text-primary);
            border: 2px solid var(--input-border);
        }

        .air-quality h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .aqi-indicator {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .aqi-good { background: #48bb78; color: white; }
        .aqi-fair { background: #ecc94b; color: white; }
        .aqi-moderate { background: #ed8936; color: white; }
        .aqi-poor { background: #f56565; color: white; }
        .aqi-very-poor { background: #9b2c2c; color: white; }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #667eea;
            display: none;
        }

        .air-quality p {
            color: var(--text-primary);
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .forecast-container {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .sun-times {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ SkyCheck</h1>
        <p class="subtitle">Il tuo meteo in tempo reale</p>

        <!-- Sezione ricerca -->
        <div class="search-section">
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Inserisci il nome della città (es: Napoli)...">
                <button class="btn-search" onclick="searchByCity()">🔍 Cerca</button>
            </div>
            <button class="btn-location" onclick="getLocationWeather()">📍 Usa la mia posizione</button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">⏳ Caricamento dati meteo...</div>

        <!-- Messaggio errore -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Informazioni meteo -->
        <div class="weather-info" id="weatherInfo">
            <h2 class="city-name" id="cityName"></h2>
            
            <!-- Allerte meteo -->
            <div class="weather-alerts" id="weatherAlerts">
                <h3>⚠️ Allerte Meteo</h3>
                <div id="alertsContent"></div>
            </div>

            <!-- Mappa -->
            <div class="map-container">
                <div class="map-header">
                    <h3>🗺️ Mappa Meteo</h3>
                    <div class="map-controls">
                        <button class="map-toggle" id="toggleClouds" onclick="toggleLayer('clouds')">☁️ Nuvole</button>
                        <button class="map-toggle" id="togglePrecip" onclick="toggleLayer('precipitation')">🌧️ Pioggia</button>
                        <button class="map-toggle" id="toggleTemp" onclick="toggleLayer('temp')">🌡️ Temperatura</button>
                    </div>
                </div>
                <div id="map"></div>
            </div>

            <div class="weather-card">
                <div class="weather-icon-main" id="weatherIcon"></div>
                <div class="temp-main" id="temperature"></div>
                <div class="weather-description" id="description"></div>
                
                <!-- Alba e Tramonto -->
                <div class="sun-times">
                    <div class="sun-time-item">
                        <div class="sun-time-icon">🌅</div>
                        <div class="sun-time-label">Alba</div>
                        <div class="sun-time-value" id="sunrise"></div>
                    </div>
                    <div class="sun-time-item">
                        <div class="sun-time-icon">🌇</div>
                        <div class="sun-time-label">Tramonto</div>
                        <div class="sun-time-value" id="sunset"></div>
                    </div>
                </div>
                
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-icon">🌡️</div>
                        <div class="detail-label">Percepita</div>
                        <div class="detail-value" id="feelsLike"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">💧</div>
                        <div class="detail-label">Umidità</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">💨</div>
                        <div class="detail-label">Vento</div>
                        <div class="detail-value" id="wind"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🎚️</div>
                        <div class="detail-label">Pressione</div>
                        <div class="detail-value" id="pressure"></div>
                    </div>
                </div>
            </div>

            <!-- Previsioni 5 giorni -->
            <div class="forecast-section">
                <h3>📅 Previsioni 5 Giorni</h3>
                <div class="forecast-container" id="forecastContainer"></div>
            </div>

            <div class="air-quality">
                <h3>🌬️ Qualità dell'Aria</h3>
                <div id="airQualityContent"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_KEY = '0a6d56de19e0ba91d4c792c2d0eb6405';

        let map = null;
        let marker = null;
        let weatherLayers = {
            clouds: null,
            precipitation: null,
            temp: null
        };

        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        function initMap(lat, lon) {
            if (map) {
                map.setView([lat, lon], 10);
                if (marker) {
                    marker.setLatLng([lat, lon]);
                } else {
                    marker = L.marker([lat, lon]).addTo(map);
                }
            } else {
                map = L.map('map').setView([lat, lon], 10);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(map);
                
                marker = L.marker([lat, lon]).addTo(map);
            }
        }

        function toggleLayer(layerType) {
            const buttonMap = {
                'clouds': 'toggleClouds',
                'precipitation': 'togglePrecip',
                'temp': 'toggleTemp'
            };
            
            const button = document.getElementById(buttonMap[layerType]);
            
            if (weatherLayers[layerType]) {
                map.removeLayer(weatherLayers[layerType]);
                weatherLayers[layerType] = null;
                button.classList.remove('active');
            } else {
                let layerUrl = '';
                
                if (layerType === 'clouds') {
                    layerUrl = `https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`;
                } else if (layerType === 'precipitation') {
                    layerUrl = `https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`;
                } else if (layerType === 'temp') {
                    layerUrl = `https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`;
                }
                
                weatherLayers[layerType] = L.tileLayer(layerUrl, {
                    attribution: '© OpenWeatherMap',
                    opacity: 0.6
                }).addTo(map);
                
                button.classList.add('active');
            }
        }

        async function searchByCity() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Per favore inserisci il nome di una città');
                return;
            }

            await getWeatherData(city);
        }

        async function getLocationWeather() {
            if (!navigator.geolocation) {
                showError('La geolocalizzazione non è supportata dal tuo browser');
                return;
            }

            showLoading(true);
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    await getWeatherData(null, lat, lon);
                },
                (error) => {
                    showLoading(false);
                    let errorMsg = 'Impossibile ottenere la tua posizione. ';
                    if (error.code === error.PERMISSION_DENIED) {
                        errorMsg += 'Hai negato il permesso di geolocalizzazione.';
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        errorMsg += 'Posizione non disponibile.';
                    } else {
                        errorMsg += 'Timeout nella richiesta.';
                    }
                    showError(errorMsg);
                }
            );
        }

        async function getWeatherData(city = null, lat = null, lon = null) {
            showLoading(true);
            hideError();

            try {
                let weatherUrl;
                
                if (city) {
                    weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=it`;
                } else {
                    weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=it`;
                }

                const weatherResponse = await fetch(weatherUrl);
                
                if (!weatherResponse.ok) {
                    if (weatherResponse.status === 404) {
                        throw new Error('Città non trovata. Controlla il nome e riprova.');
                    } else if (weatherResponse.status === 401) {
                        throw new Error('API key non valida.');
                    } else {
                        throw new Error(`Errore ${weatherResponse.status}`);
                    }
                }
                
                const weatherData = await weatherResponse.json();

                // Ottieni previsioni 5 giorni (API gratuita)
                const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${weatherData.coord.lat}&lon=${weatherData.coord.lon}&appid=${API_KEY}&units=metric&lang=it`;
                
                let forecastData = null;
                
                try {
                    const forecastResponse = await fetch(forecastUrl);
                    if (forecastResponse.ok) {
                        const forecast = await forecastResponse.json();
                        // Raggruppa le previsioni per giorno (prende la previsione di mezzogiorno)
                        forecastData = processForecastData(forecast.list);
                    }
                } catch (e) {
                    console.log('Errore nel caricamento previsioni:', e);
                }

                // Ottieni qualità dell'aria
                const airQualityUrl = `https://api.openweathermap.org/data/2.5/air_pollution?lat=${weatherData.coord.lat}&lon=${weatherData.coord.lon}&appid=${API_KEY}`;
                const airQualityResponse = await fetch(airQualityUrl);
                const airQualityData = await airQualityResponse.json();

                displayWeatherData(weatherData, airQualityData, forecastData);
                initMap(weatherData.coord.lat, weatherData.coord.lon);
                
            } catch (error) {
                console.error('Errore:', error);
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        // Funzione per processare i dati delle previsioni e raggruppare per giorno
        function processForecastData(forecastList) {
            const dailyForecasts = [];
            const processedDays = new Set();
            
            forecastList.forEach(item => {
                const date = new Date(item.dt * 1000);
                const dateString = date.toDateString();
                const hour = date.getHours();
                
                // Prendi solo una previsione per giorno (quella intorno a mezzogiorno)
                if (!processedDays.has(dateString) && hour >= 11 && hour <= 14) {
                    processedDays.add(dateString);
                    dailyForecasts.push({
                        dt: item.dt,
                        temp: {
                            day: item.main.temp,
                            min: item.main.temp_min,
                            max: item.main.temp_max
                        },
                        weather: item.weather
                    });
                }
            });
            
            return dailyForecasts.slice(0, 5); // Massimo 5 giorni
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            if (date.toDateString() === today.toDateString()) {
                return 'Oggi';
            } else if (date.toDateString() === tomorrow.toDateString()) {
                return 'Domani';
            } else {
                return date.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
            }
        }

        function displayWeatherData(weather, airQuality, forecast) {
            document.getElementById('cityName').textContent = `${weather.name}, ${weather.sys.country}`;
            
            const iconCode = weather.weather[0].icon;
            const weatherIcon = weatherIcons[iconCode] || '🌤️';
            document.getElementById('weatherIcon').textContent = weatherIcon;
            
            document.getElementById('temperature').textContent = `${Math.round(weather.main.temp)}°C`;
            document.getElementById('description').textContent = weather.weather[0].description;
            
            // Alba e tramonto
            document.getElementById('sunrise').textContent = formatTime(weather.sys.sunrise);
            document.getElementById('sunset').textContent = formatTime(weather.sys.sunset);
            
            document.getElementById('feelsLike').textContent = `${Math.round(weather.main.feels_like)}°C`;
            document.getElementById('humidity').textContent = `${weather.main.humidity}%`;
            document.getElementById('wind').textContent = `${Math.round(weather.wind.speed * 3.6)} km/h`;
            document.getElementById('pressure').textContent = `${weather.main.pressure} hPa`;

            // Nascondi le allerte (non disponibili con API gratuita)
            document.getElementById('weatherAlerts').classList.remove('active');

            // Previsioni 5 giorni
            if (forecast && forecast.length > 0) {
                let forecastHtml = '';
                forecast.forEach((day) => {
                    const icon = weatherIcons[day.weather[0].icon] || '🌤️';
                    forecastHtml += `
                        <div class="forecast-day">
                            <div class="forecast-date">${formatDate(day.dt)}</div>
                            <div class="forecast-icon">${icon}</div>
                            <div class="forecast-temp">${Math.round(day.temp.day)}°C</div>
                            <div class="forecast-temp-range">${Math.round(day.temp.min)}° / ${Math.round(day.temp.max)}°</div>
                            <div class="forecast-desc">${day.weather[0].description}</div>
                        </div>
                    `;
                });
                document.getElementById('forecastContainer').innerHTML = forecastHtml;
            } else {
                document.getElementById('forecastContainer').innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Previsioni non disponibili</p>';
            }

            // Qualità dell'aria
            const aqi = airQuality.list[0].main.aqi;
            const aqiLabels = ['', 'Buona', 'Discreta', 'Moderata', 'Scarsa', 'Pessima'];
            const aqiClasses = ['', 'aqi-good', 'aqi-fair', 'aqi-moderate', 'aqi-poor', 'aqi-very-poor'];
            
            const components = airQuality.list[0].components;
            
            document.getElementById('airQualityContent').innerHTML = `
                <div class="aqi-indicator ${aqiClasses[aqi]}">
                    Qualità: ${aqiLabels[aqi]} (AQI: ${aqi})
                </div>
                <div style="margin-top: 15px;">
                    <p><strong>PM2.5:</strong> ${components.pm2_5.toFixed(2)} μg/m³</p>
                    <p><strong>PM10:</strong> ${components.pm10.toFixed(2)} μg/m³</p>
                    <p><strong>NO₂:</strong> ${components.no2.toFixed(2)} μg/m³</p>
                    <p><strong>O₃:</strong> ${components.o3.toFixed(2)} μg/m³</p>
                    <p><strong>CO:</strong> ${components.co.toFixed(2)} μg/m³</p>
                </div>
            `;

            document.getElementById('weatherInfo').style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '❌ ' + message;
            errorEl.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchByCity();
            }
        });

        console.log('☁️ SkyCheck v2.0 caricato!');
    </script>
</body>
</html>
